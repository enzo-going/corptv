name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security and authorship baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pinned Actions and neutral source tree
        shell: bash
        run: |
          set -euo pipefail

          unpinned="$(git grep -n -E '^[[:space:]]*uses:[[:space:]]*[^[:space:]#]+@' -- .github/workflows \
            | grep -vE '@[0-9a-fA-F]{40}([[:space:]]|#|$)' || true)"
          if [[ -n "$unpinned" ]]; then
            echo 'Found an unpinned GitHub Action:'
            printf '%s\n' "$unpinned"
            exit 1
          fi

          forbidden="$(git grep -n -i -E '(^|[^[:alnum:]_])(generated by|gerado por|assisted by|co-authored-by)($|[^[:alnum:]_])' -- ':!package-lock.json' ':!.github/workflows/repository-hygiene.yml' || true)"
          if [[ -n "$forbidden" ]]; then
            echo 'Found a prohibited platform or authorship reference:'
            printf '%s\n' "$forbidden"
            exit 1
          fi
